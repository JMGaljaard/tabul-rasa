# Runs TABDIFF + GRADIENT DIFFERENCE
defaults:
    - tabdiff
    - unlearn: feature_ascent
    - override wandb: unlearn
    - override dataset: magic
    - _self_

exp_name: ${unlearn.str_repr}_cl=${unlearn.column}_st=${unlearn.main.steps}
model_load_path: ./ckpt/${dataset.name}=${experiment.seed}/${diffusion.exp_name_model}
model_save_path: ./ckpt/${dataset.name}=${experiment.seed}/ul/${diffusion.exp_name_model}/${.exp_name}
result_save_path: ./result/${dataset.name}=${experiment.seed}/ul/${diffusion.exp_name_model}/${.exp_name}


# Unlearn layout
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      unlearn.column: "'1','2','3'"
#      unlearn.column: "'8','9','0'" # Define as a list of strings, explicitly escaped
      unlearn.main.steps: 500, 1500
      unlearn.main.lr: 1e-6, 1e-5, 1e-4 #
